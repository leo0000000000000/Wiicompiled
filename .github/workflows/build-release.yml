name: "Build and Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numero di versione (es. 0.2.28.1)'
        required: true
        default: '0.2.28.1'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject Version into Code
        id: set_version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}".TrimStart('v')
          $tag = "v$v"
          Write-Host "Compilazione con versione: $v (Tag: $tag)"

          $progFile = "Launcher/WiiCompiled.Setup.Windows/Program.cs"
          (Get-Content $progFile) -replace 'public const string Version = "[^"]+";', "public const string Version = `"$v`";" | Set-Content $progFile

          $projFile = "Launcher/WiiCompiled.Setup.Windows/WiiCompiled.Setup.Windows.csproj"
          (Get-Content $projFile) -replace '<Version>[^<]+</Version>', "<Version>$v</Version>" | Set-Content $projFile

          $buildScript = "Launcher/Build-Installer.ps1"
          (Get-Content $buildScript) -replace "ProductVersion = '[^']+'", "ProductVersion = '$v'" | Set-Content $buildScript

          $overlayFile = "runtime/src/settings_overlay.cpp"
          if (Test-Path $overlayFile) {
              (Get-Content $overlayFile) -replace 'WiiCompiled v[0-9a-zA-Z\.\-]+', "WiiCompiled v$v" | Set-Content $overlayFile
          }

          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Generate Patch Notes
        id: patch_notes
        shell: pwsh
        run: |
          $commits = git log -n 5 --pretty=format:"* %s (%h)"
          $notes = "### What's New in this Build:`n$commits`n`n---`n*Custom build of WiiCompiled featuring native Keyboard & Mouse controls.*"
          $notes | Out-File -FilePath patchnotes.md -Encoding utf8

      - name: Build Windows Installer
        shell: pwsh
        run: |
          ./Launcher/Build-Installer.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_version.outputs.TAG }}
          name: WiiCompiled ${{ steps.set_version.outputs.TAG }}
          files: Launcher/dist/WiiCompiled-Setup.exe
          body_path: patchnotes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}